<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Termtrainer</title>
<style>
  html, body {
    height: 100%;
    overflow-x: hidden;
  }
  body {
    font-family: system-ui, Arial, sans-serif;
    background: linear-gradient(to bottom right,#f0f4ff,#e0f7fa);
    text-align: center;
    margin: 0;
    padding: 20px;
    scroll-behavior: smooth;
  }
  h1,h2 { color:#333; margin:10px 0; }
  #task,#taskAddWrapper { font-size:1.8em; margin:15px; word-wrap:break-word; display:inline-block; position:relative; }
  #taskAdd { display:inline; }
  #eqMark { font-size:1.1em; margin-left:6px; color:#333; white-space:nowrap; vertical-align:middle; }
  #result,#resultAdd { font-size:1.3em; margin:10px; font-weight:bold; }
  #score,#scoreAdd { font-size:1.1em; margin:8px; color:#333; }
  input {
    padding:10px;
    font-size:1.2em;
    width:80%;
    max-width:300px;
    text-align:center;
    border-radius:8px;
    border:1px solid #aaa;
  }
  button {
    background:#007bff;
    color:white;
    border:none;
    padding:10px 18px;
    margin:6px;
    font-size:1em;
    border-radius:8px;
    cursor:pointer;
  }
  button:hover { background:#0056b3; }
  hr { margin:30px auto; width:70%; border:1px solid #ccc; }

  /* Eingabehilfe-Buttons */
  .shortcutButtons { margin-top:8px; }
  .shortcutButtons button {
    background:#e3e3e3;
    color:#000;
    border:1px solid #bbb;
    padding:6px 10px;
    font-size:1.1em;
  }
  .shortcutButtons button:hover { background:#ccc; }

  /* Buttons nur auf großen Bildschirmen ausblenden */
  @media (min-width: 700px) {
    .shortcutButtons { display: none; }
  }

  /* Handy: größere Buttons, bessere Touchfläche */
  @media (max-width: 700px) {
    .shortcutButtons button {
      padding: 8px 14px;
      font-size: 1.3em;
    }
  }
</style>
</head>
<body>
<h1>Term-Multiplikation</h1>
<div id="score">Aufgabe 1 von 10 – Punkte: 0</div>
<div id="task">lade...</div>

<input type="text" id="answer" placeholder="Deine Lösung" autocomplete="off" spellcheck="false"><br>
<div id="shortcutMul" class="shortcutButtons">
  <button type="button" onclick="insertSymbol('²')">²</button>
  <button type="button" onclick="insertSymbol('³')">³</button>
</div>
<button id="checkBtn">Prüfen</button>
<button id="newBtn">Neue Aufgabe</button>

<p id="result"></p>

<hr>

<h2>Addition & Subtraktion</h2>
<div id="scoreAdd">Aufgabe 1 von 10 – Punkte: 0</div>
<div id="taskAddWrapper">
  <span id="taskAdd">lade...</span><span id="eqMark">= ?</span>
</div>

<input type="text" id="answerAdd" placeholder="Zusammengefasster Term" autocomplete="off" spellcheck="false"><br>
<div id="shortcutAdd" class="shortcutButtons">
  <button type="button" onclick="insertSymbol('²')">²</button>
  <button type="button" onclick="insertSymbol('³')">³</button>
</div>
<button id="checkBtnAdd">Prüfen</button>
<button id="newBtnAdd">Neue Aufgabe</button>

<p id="resultAdd"></p>

<p style="font-size:0.8em;color:#555;margin-top:40px;">
Diese Seite speichert keine persönlichen Daten und läuft vollständig lokal im Browser.<br>
© 2025 Termtrainer für den Mathematikunterricht
</p>

<script>
document.addEventListener("DOMContentLoaded",()=>{

  const answerEl   = document.getElementById("answer");
  const answerAdd  = document.getElementById("answerAdd");
  let lastFocusedInput = answerEl;

  // Scrollt Eingabefeld sichtbar bei Fokus (mobil)
  function scrollIntoViewOnFocus(el) {
    el.addEventListener("focus", () => {
      lastFocusedInput = el;
      setTimeout(() => {
        el.scrollIntoView({ behavior: "instant", block: "center" });
      }, 100);
    });
  }
  [answerEl, answerAdd].forEach(scrollIntoViewOnFocus);

  // Symbol-Buttons für Hochzahlen
  window.insertSymbol = function(symbol) {
    const target = lastFocusedInput || answerEl;
    target.focus();
    const start = target.selectionStart ?? target.value.length;
    const end   = target.selectionEnd   ?? target.value.length;
    const text  = target.value;
    target.value = text.slice(0, start) + symbol + text.slice(end);
    const pos = start + symbol.length;
    requestAnimationFrame(()=>{
      target.selectionStart = target.selectionEnd = pos;
      target.scrollIntoView({ behavior: "instant", block: "center" });
    });
  };

  // Hilfsfunktionen
  const COEFFS=[2,3,4,5,6,7,8,9];
  const VARS=['a','b','m','n','p','q','x','y'];
  const randomChoice=a=>a[Math.floor(Math.random()*a.length)];
  const randomSign=()=>Math.random()<0.5?'-':'+';
  const randomCoeff=()=>randomChoice(COEFFS);
  const randomVar=()=>randomChoice(VARS);
  const simplify=(s1,s2)=>s1===s2?'+':'-';
  const formatCoeff=(n,isVar)=>{if(!isVar)return String(n);if(n===1)return"";if(n===-1)return"-";return String(n)};
  const sortVars=(v1,v2)=>[v1,v2].sort().join('');
  const normMul = s => s.replace(/\s+/g,'').replace(/²/g,'^2').replace(/−/g,'-').toLowerCase();
  const normAdd = s => s.replace(/\s+/g,'').replace(/−/g,'-').toLowerCase();

  // ----------------- MULTIPLIKATION -----------------
  const taskEl=document.getElementById("task");
  const resultEl=document.getElementById("result");
  const checkBtn=document.getElementById("checkBtn");
  const newBtn=document.getElementById("newBtn");
  const scoreEl=document.getElementById("score");

  let correctSolution="";
  let round=1,score=0,totalRounds=10;

  function createSimpleTask(){
    const sameVar=Math.random()<0.5;
    const s1=randomSign(),s2=randomSign();
    const n1=randomCoeff(),n2=randomCoeff();
    let v1=randomVar(),v2=randomVar();
    if(!sameVar){while(v2===v1)v2=randomVar();} else v2=v1;
    const aufgabe=`(${s1}${n1}${v1}) · (${s2}${n2}${v2}) = ?`;
    const sign=simplify(s1,s2);
    let coeff=(sign==='-')?-n1*n2:n1*n2;
    correctSolution=(v1===v2)?
      `${formatCoeff(coeff,true)}${v1}²`:
      `${formatCoeff(coeff,true)}${sortVars(v1,v2)}`;
    return aufgabe;
  }

function createGeneralBinom(){
  let v1 = randomVar(), v2 = randomVar();
  if (Math.random() < 0.5) v2 = v1; // ~50% gleiche Variable

  const a1 = randomCoeff();
  let a2 = randomCoeff();
  if (Math.random() < 0.5) a2 = a1; // ~50% gleiche Koeffizienten

  const b = randomCoeff(), c = randomCoeff();
  const s1 = randomSign(), s2 = randomSign();

  const term = `(${a1}${v1} ${s1} ${b}) · (${a2}${v2} ${s2} ${c}) = ?`;

  const sb = s1 === '+' ? 1 : -1;
  const sc = s2 === '+' ? 1 : -1;
  const sameVar = v1 === v2;

  let sol = "";
  if (sameVar) {
    const a2v2 = a1 * a2;
    const xCoeff = (a1 * sc * c) + (a2 * sb * b);
    const bc = sb * sc * b * c;
    sol = `${formatCoeff(a2v2, true)}${v1}²`;
    if (xCoeff > 0) sol += ` + ${formatCoeff(xCoeff, true)}${v1}`;
    else if (xCoeff < 0) sol += ` - ${formatCoeff(Math.abs(xCoeff), true)}${v1}`;
    if (bc > 0) sol += ` + ${bc}`;
    else if (bc < 0) sol += ` - ${Math.abs(bc)}`;
  } else {
    const a1a2 = a1 * a2;
    const ab = a1 * sc * c;
    const ac = a2 * sb * b;
    const bc = sb * sc * b * c;
    // ▼ HIER der Fix: Variablen alphabetisch sortieren
    sol = `${formatCoeff(a1a2, true)}${sortVars(v1, v2)}`;
    if (ab > 0) sol += ` + ${formatCoeff(ab, true)}${v1}`;
    else if (ab < 0) sol += ` - ${formatCoeff(Math.abs(ab), true)}${v1}`;
    if (ac > 0) sol += ` + ${formatCoeff(ac, true)}${v2}`;
    else if (ac < 0) sol += ` - ${formatCoeff(Math.abs(ac), true)}${v2}`;
    if (bc > 0) sol += ` + ${bc}`;
    else if (bc < 0) sol += ` - ${Math.abs(bc)}`;
  }

  correctSolution = sol;
  return term.replace(/\s+/g, ' ');
}


  function createPlusMinusBinom(){
    const v=randomVar(),a=randomCoeff(),b=randomCoeff();
    correctSolution=`${formatCoeff(a*a,true)}${v}² - ${b*b}`;
    return `(${a}${v} + ${b}) · (${a}${v} - ${b}) = ?`;
  }

  function newTask(){
    resultEl.innerText="";answerEl.value="";
    if(round>totalRounds){
      taskEl.innerText="🎉 Übungsrunde fertig!";
      resultEl.style.color="green";
      resultEl.innerText=`Endstand: ${score}/${totalRounds} Punkte.`;
      newBtn.textContent="Neue Runde";
      round=1;score=0;
      return;
    }
    const r=Math.random();
    let aufgabe;
    if(r<0.45)aufgabe=createSimpleTask();
    else if(r<0.80)aufgabe=createGeneralBinom();
    else aufgabe=createPlusMinusBinom();
    taskEl.innerText=aufgabe;
    scoreEl.innerText=`Aufgabe ${round} von ${totalRounds} – Punkte: ${score}`;
  }

  function checkAnswer(){
    const input=answerEl.value.trim();
    if(!input){
      resultEl.style.color="gray";
      resultEl.innerText="Bitte gib eine Lösung ein.";return;
    }
    answerEl.blur(); // Tastatur schließen
    if(normMul(input)===normMul(correctSolution)){
      resultEl.style.color="green";
      resultEl.innerText="✅ Richtig!";
      score++;
    }else{
      resultEl.style.color="red";
      resultEl.innerText=`❌ Falsch! Richtig: ${correctSolution}`;
    }
    round++;
    scoreEl.innerText=`Aufgabe ${Math.min(round,totalRounds)} von ${totalRounds} – Punkte: ${score}`;
  }

  checkBtn.addEventListener("click",checkAnswer);
  newBtn.addEventListener("click",newTask);
  answerEl.addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer();});
  newTask();

  // ----------------- ADDITION -----------------
  const taskAdd=document.getElementById("taskAdd");
  const resultAdd=document.getElementById("resultAdd");
  const checkBtnAdd=document.getElementById("checkBtnAdd");
  const newBtnAdd=document.getElementById("newBtnAdd");
  const scoreAdd=document.getElementById("scoreAdd");

  let correctSum="",pointsAdd=0,roundAdd=1,totalAdd=10;
  const superExp={2:"²",3:"³"};

  function createAdditionTask(){
    const termCount=Math.floor(Math.random()*4)+2;
    const variable=randomVar();
    let terms=[];
    for(let i=0;i<termCount;i++){
      const coeff=randomCoeff()*(Math.random()<0.5?-1:1);
      const exp=Math.floor(Math.random()*4);
      let t="";
      if(exp===0)t=`${coeff}`;
      else t=`${coeff}${variable}${exp>1?superExp[exp]:""}`;
      terms.push(t);
    }
    const display=terms.join(" + ").replace(/\+\s*-/g," - ");

    let collected={};
    for(const t of terms){
      const m=t.match(/(-?\d+)([a-z])?(?:([²³]))?/);
      if(m){
        const num=parseInt(m[1]);
        const v=m[2]||"";
        let e=0;
        if(m[3]==="²")e=2;
        else if(m[3]==="³")e=3;
        else if(v)e=1;
        const key=v+e;
        collected[key]=(collected[key]||0)+num;
      }
    }

    const sorted=Object.entries(collected)
      .filter(([_,v])=>v!==0)
      .sort((a,b)=>{
        const eA=parseInt(a[0].slice(1)||0);
        const eB=parseInt(b[0].slice(1)||0);
        if(eA!==eB)return eB-eA;
        return a[0].localeCompare(b[0]);
      });

    let res="";
    for(const [key,val] of sorted){
      const v=key[0].match(/[a-z]/)?key[0]:"";
      const e=parseInt(key.slice(1)||0);
      if(res!=="")res+=val>=0?" + ":" - ";
      else if(val<0)res+="-";
      const abs=Math.abs(val);
      if(e===0)res+=abs;
      else res+=`${abs===1?"":abs}${v}${superExp[e]||""}`;
    }

    correctSum=res;
    return display;
  }

  function newAdditionTask(){
    resultAdd.innerText="";answerAdd.value="";
    if(roundAdd>totalAdd){
      taskAdd.innerText="🎉 Übungsrunde fertig!";
      resultAdd.style.color="green";
      resultAdd.innerText=`Endstand: ${pointsAdd}/${totalAdd} Punkte.`;
      newBtnAdd.textContent="Neue Runde";
      roundAdd=1;pointsAdd=0;
      return;
    }
    const aufgabe=createAdditionTask();
    taskAdd.innerText=aufgabe;
    scoreAdd.innerText=`Aufgabe ${roundAdd} von ${totalAdd} – Punkte: ${pointsAdd}`;
  }

  function checkAdditionAnswer(){
    const input=answerAdd.value.trim();
    if(!input){
      resultAdd.style.color="gray";
      resultAdd.innerText="Bitte gib eine Lösung ein.";return;
    }
    answerAdd.blur(); // Tastatur schließen
    if(normAdd(input)===normAdd(correctSum)){
      resultAdd.style.color="green";
      resultAdd.innerText="✅ Richtig!";
      pointsAdd++;
    }else{
      resultAdd.style.color="red";
      resultAdd.innerText=`❌ Falsch! Richtige Lösung: ${correctSum}`;
    }
    roundAdd++;
    scoreAdd.innerText=`Aufgabe ${Math.min(roundAdd,totalAdd)} von ${totalAdd} – Punkte: ${pointsAdd}`;
  }

  checkBtnAdd.addEventListener("click",checkAdditionAnswer);
  newBtnAdd.addEventListener("click",newAdditionTask);
  answerAdd.addEventListener("keydown",e=>{if(e.key==="Enter")checkAdditionAnswer();});
  newAdditionTask();

});
</script>
</body>
</html>
